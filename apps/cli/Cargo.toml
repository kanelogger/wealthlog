[package]
name = "wealthlog-cli"
version.workspace = true
edition.workspace = true
description = "Local Wealthlog command-line client"
license = "AGPL-3.0"

[[bin]]
name = "wealthlog"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
clap = { version = "4.5", features = ["derive", "env"] }
dirs = "6"
http = "1"
libc = "0.2"
rmcp = { workspace = true, features = ["client", "transport-streamable-http-client-unix-socket"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time", "io-util"] }
uuid = { workspace = true }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
