id: EDGE-MIX-03
title: Live cash transfers and snapshot reconciliation in a holdings account
intent: >
  acc-a sends 100 cash to acc-h (HOLDINGS) on 01-03, a paired transfer
  inside the portfolio. acc-h's snapshots go from 100 to 150 cash, so the
  owner also took 50 out. The cash transfer contributes 100 on its recorded
  day; the new snapshot reconciles the expected 200 cash to the observed
  150, adding a 50 outflow. Both transfer legs cancel inside the portfolio,
  leaving the 50 withdrawal.
policy: { base_currency: USD, timezone: UTC, as_of: 2025-01-04 }
accounts:
  - { id: acc-a, currency: USD }
  - { id: acc-h, currency: USD, tracking_mode: HOLDINGS }
activities:
  - { id: dep, account: acc-a, type: DEPOSIT, date: 2025-01-01T10:00:00Z, amount: 1000 }
  - { id: out, account: acc-a, type: TRANSFER_OUT, date: 2025-01-03T10:00:00Z, amount: 100, source_group_id: g }
  - { id: tin, account: acc-h, type: TRANSFER_IN, date: 2025-01-03T11:00:00Z, amount: 100, source_group_id: g }
observed_snapshots:
  - { account: acc-h, date: 2025-01-01, cash: { USD: 100 } }
  - { account: acc-h, date: 2025-01-03, cash: { USD: 150 } }
expected_notes: >
  acc-a: outflow 100 on 01-03. acc-h: inflow 100 and reconciliation outflow
  50 on 01-03. Portfolio flows: inflow 0, outflow 50, net -50. Cash transfers
  update manual cash between snapshots; snapshot reconciliation accounts
  for the remaining observed change without counting the transfer twice.
